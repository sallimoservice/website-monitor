name: Website Monitor

on:
  schedule:
    # Every 8 hours (00:17, 08:17 and 16:17 UTC). GitHub may start it a few minutes late.
    # Not minute 0 on purpose: GitHub delays and sometimes drops scheduled runs at the start of the hour.
    # To run every 2 hours instead, change the line below to:  - cron: "17 */2 * * *"
    - cron: "17 */8 * * *"
  workflow_dispatch:             # the "Run workflow" button
    inputs:
      dry_run:
        description: "Dry run (run checks, send nothing, save nothing)"
        type: boolean
        default: false
      test_alert:
        description: "Send a test message to every configured channel"
        type: boolean
        default: false

# Only one run at a time, so two runs can never overlap or corrupt the saved state.
concurrency:
  group: website-monitor
  cancel-in-progress: false

permissions:
  contents: read
  actions: write                 # needed only to delete old state caches

jobs:
  monitor:
    runs-on: ubuntu-latest
    # A run takes about 4 minutes when sites are failing (3 visits, 60 seconds apart) and up to about
    # 6.5 minutes in the worst case (servers that answer very slowly), plus about a minute of setup.
    # It takes well under a minute when all is well. 15 minutes leaves room, and still stops a stuck run.
    # A run killed by this limit is a silent run, so the limit must never be close to the worst case.
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # state.json lives in the Actions cache (private to this repo, never in the code).
      # Every run restores the newest saved copy (reading is always safe). Only a real run
      # saves a new one. Dry runs and test alerts never write to the cache.
      - name: Restore saved state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: monitor-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            monitor-state-

      - name: Run monitor
        id: monitor
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          SITES_JSON: ${{ secrets.SITES_JSON }}
          STATE_SALT: ${{ secrets.STATE_SALT }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          # Optional settings. Add them as repository VARIABLES (not secrets):
          # Settings > Secrets and variables > Actions > Variables. Empty means "use the default".
          NOTIFY_ON_BLOCKED_CHANGE: ${{ vars.NOTIFY_ON_BLOCKED_CHANGE }}
          USER_AGENT: ${{ vars.USER_AGENT }}
          RETRY_GAP_SECONDS: ${{ vars.RETRY_GAP_SECONDS }}
          # Removed settings. They are passed on only so the monitor can log that they are ignored.
          REQUEST_TIMEOUT_SECONDS: ${{ vars.REQUEST_TIMEOUT_SECONDS }}
          CLOUDFLARE_RETRY_GAP_SECONDS: ${{ vars.CLOUDFLARE_RETRY_GAP_SECONDS }}
          DRY_RUN: ${{ inputs.dry_run }}
          TEST_ALERT: ${{ inputs.test_alert }}
        run: |
          if [ "$TEST_ALERT" = "true" ]; then
            python -m monitor.main --test-alert
          elif [ "$DRY_RUN" = "true" ]; then
            python -m monitor.main --dry-run
          else
            python -m monitor.main
          fi

      # If anything above crashed (even installing packages), tell the owner by email.
      - name: Alert that the monitor is broken
        if: failure() && inputs.test_alert != true && inputs.dry_run != true
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          STATE_SALT: ${{ secrets.STATE_SALT }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m monitor.main --notify-crash

      - name: Save state
        if: always() && inputs.dry_run != true && inputs.test_alert != true && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: monitor-state-${{ github.run_id }}-${{ github.run_attempt }}

      # Cache entries cannot be overwritten, so each run adds one. Keep only the newest 3.
      # Only caches of THIS branch are listed (--ref), so a run can never delete the saved state of
      # another branch, such as main's. Dry runs and test alerts only READ the saved state. They
      # never save and never delete.
      - name: Delete old state caches
        if: always() && inputs.dry_run != true && inputs.test_alert != true
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh cache list --key monitor-state- --ref "$GITHUB_REF" --sort created_at --order desc --limit 100 --json id --jq '.[3:][].id' \
            | xargs -r -n1 gh cache delete
